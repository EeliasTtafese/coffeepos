 <div class="tot big" style="color:${paid-t.total>=0?'var(--green)':'var(--danger)'}"><span>Change</span><span>${paid?m$(paid-t.total):'—'}</span></div>
 <div class="pad">${[7,8,9,'C',4,5,6,'.',1,2,3,0].map(k=>`<button onclick="pk('${k}')">${k}</button>`).join('')}<button style="grid-column:span 4" onclick="cur.paid=String(${t.total});render()">Exact amount</button></div></div>
 <div class="row"><button class="pri" style="flex:1;padding:12px" onclick="saveOrder()">✅ Next Order (save)</button><button onclick="cur.lines.length?prn(cur):toast('Nothing to print')">🖨️ Print</button><button onclick="newOrder();render()">New</button></div></div></div>`}
function ordV(){const os=[...S.orders].sort((a,b)=>b.id-a.id),today=new Date().toDateString(),sum=a=>r2(a.reduce((x,o)=>x+tot(o).total,0)),td=os.filter(o=>new Date(o.date).toDateString()===today);
 return `<div class="stats"><div class="card stat"><span class="muted">Orders</span><b>${os.length}</b></div><div class="card stat"><span class="muted">All-time sales</span><b>${m$(sum(os))}</b></div><div class="card stat"><span class="muted">Today</span><b>${m$(sum(td))} <small class="muted">(${td.length})</small></b></div><div class="card stat"><span class="muted">Avg order</span><b>${m$(os.length?sum(os)/os.length:0)}</b></div></div>
 <div class="card wrap"><table><tr><th>#</th><th>Date &amp; time</th><th>Location</th><th>Payment</th><th>Items</th><th>Total</th><th>Paid</th><th></th></tr>${os.map(o=>`<tr><td>${o.id}</td><td>${new Date(o.date).toLocaleString()}</td><td>${o.loc}</td><td>${o.pay}</td><td>${o.lines.length}</td><td>${m$(tot(o).total)}</td><td>${m$(o.paid)}</td><td style="white-space:nowrap"><button onclick="loadOrder(${o.id})">Open</button> <button onclick="prn(S.orders.find(x=>x.id===${o.id}))">🖨️</button> <button class="dng" onclick="delOrder(${o.id})">Delete</button></td></tr>`).join('')||'<tr><td colspan=8 class="muted">No orders yet.</td></tr>'}</table></div>`}
function menuV(){const o=(a,v)=>a.map(x=>`<option${x===v?' selected':''}>${x}</option>`).join('');
 return `<div class="card wrap"><div class="row"><h3 style="margin:0;flex:1">Menu items</h3><button class="pri" onclick="add('items')">+ Item</button></div><table><tr><th>Name</th><th>Type</th><th>Hot/Cold</th><th>Category</th><th>Small / price</th><th>Medium</th><th>Large</th><th></th></tr>${S.items.map(i=>`<tr><td><input value="${i.name}" onchange="upd('items',${i.id},'name',this.value)"></td><td><select onchange="upd('items',${i.id},'type',this.value)">${o(['Drink','Food','Bean'],i.type)}</select></td><td><select onchange="upd('items',${i.id},'drink',this.value)">${o(['','Hot','Cold'],i.drink||'')}</select></td><td><input value="${i.cat}" onchange="upd('items',${i.id},'cat',this.value)"></td>${[0,1,2].map(k=>`<td><input type="number" step="0.01" value="${i.p[k]??''}" onchange="upd('items',${i.id},'p${k}',this.value)"></td>`).join('')}<td><button class="dng" onclick="del('items',${i.id})">✕</button></td></tr>`).join('')}</table></div>
 <div class="card wrap"><div class="row"><h3 style="margin:0;flex:1">Add-ins &amp; options</h3><button class="pri" onclick="add('addins')">+ Add-in</button></div><table><tr><th>Name</th><th>For</th><th>Price</th><th></th></tr>${S.addins.map(a=>`<tr><td><input value="${a.name}" onchange="upd('addins',${a.id},'name',this.value)"></td><td><select onchange="upd('addins',${a.id},'type',this.value)">${o(['Drink','Food','Bean'],a.type)}</select></td><td><input type="number" step="0.01" value="${a.price}" onchange="upd('addins',${a.id},'price',this.value,1)"></td><td><button class="dng" onclick="del('addins',${a.id})">✕</button></td></tr>`).join('')}</table></div>`}
function setV(){const s=S.set,o=(a,v)=>a.map(x=>`<option${x===v?' selected':''}>${x}</option>`).join(''),f=(l,c)=>`<div class="row"><span style="width:160px">${l}</span>${c}</div>`;
 return `<div class="card" style="max-width:560px"><h3>Shop &amp; receipt</h3>${f('Shop name',`<input value="${s.store}" onchange="setv('store',this.value)">`)}${f('Branch',`<input value="${s.branch}" onchange="setv('branch',this.value)">`)}${f('Register #',`<input value="${s.register}" onchange="setv('register',this.value)">`)}
 <h3>Tax &amp; defaults</h3>${f('Charge sales tax',`<select onchange="setv('tax',this.value==='Yes')">${o(['Yes','No'],s.tax?'Yes':'No')}</select>`)}${f('Tax rate %',`<input type="number" step="0.01" value="${s.rate*100}" onchange="setv('rate',this.value/100,1)">`)}${f('Default size',`<select onchange="setv('defSize',this.value)">${o(SZ,s.defSize)}</select>`)}${f('Default payment',`<select onchange="setv('defPay',this.value)">${o(['Cash','Credit Card','Gift Card'],s.defPay)}</select>`)}${f('Default location',`<select onchange="setv('defLoc',this.value)">${o(['Dining In','Take Away'],s.defLoc)}</select>`)}
 <h3>Data</h3><p class="muted">Saved in this browser only. Export a backup any time.</p><div class="row"><button onclick="exp()">⬇️ Export backup</button><button class="dng" onclick="if(confirm('Reset everything to the original workbook data?')){S=JSON.parse(JSON.stringify(SEED));save();newOrder();render()}">Reset to original data</button></div></div>`}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='coffee-pos-backup.json';a.click()}
function render(){const f=document.activeElement,keep=f&&f.tagName==='INPUT'&&render.keep;render.keep=0;
 $('#nav').innerHTML=[['pos','🧾 Register'],['orders','📋 Orders'],['menu','🍰 Menu'],['set','⚙️ Settings']].map(([k,l])=>`<button class="${k===view?'on':''}" onclick="view='${k}';render()">${l}</button>`).join('');
 $('#thm').textContent=document.documentElement.dataset.theme==='dark'?'☀️':'🌙';$('#app').innerHTML={pos:posV,orders:ordV,menu:menuV,set:setV}[view]();
 if(keep){const i=$('#app input[inputmode]');i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
render();
</script></body></html>
